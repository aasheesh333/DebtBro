name: Play Store Publish (Play-signed APK)

# Builds the AAB signed with the upload key, uploads it to Google Play,
# rolls it out on the production track, then downloads the Play-signed
# universal APK generated by Google (signed with the Play App Signing key).
# The Play-signed APK is what third-party stores (OPPO, etc.) accept; the
# plain upload-key APK is NOT signed by Play and gets rejected there.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish (e.g. v2.0.2). Required."
        required: true
        type: string
      track:
        description: "Play track to roll out on"
        required: true
        default: "production"
        type: choice
        options: [production, staged_rollout_draft, internal, alpha, beta]
      staged_fraction:
        description: "Staged rollout fraction (0-1), used when track=staged_rollout_draft"
        required: false
        default: "0.1"
        type: string
      release_notes:
        description: "Release notes (en-US). Empty = reuse previous notes."
        required: false
        default: ""
        type: string

concurrency:
  group: play-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  play-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK (API 36, build-tools 36.0.0)
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Validate google-services.json
        run: |
          jq empty app/google-services.json || (echo "Invalid google-services.json" && exit 1)
          grep -q '"package_name": "com.dhanuk.debtbro"' app/google-services.json || (echo "Wrong package_name in google-services.json" && exit 1)

      - name: Determine next versionCode from Play Console
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play_sa.json"
          python3 -m pip install --quiet "pyjwt[crypto]"
          OUT=$(PLAY_SERVICE_ACCOUNT_JSON_PATH="$RUNNER_TEMP/play_sa.json" \
            timeout 120 python3 scripts/play_store.py next-version-code "$PACKAGE_NAME")
          echo "live=${OUT%%:*} next=${OUT##*:}"
          echo "VERSION_CODE=${OUT##*:}" >> "$GITHUB_ENV"

      - name: Derive version from tag
        run: |
          set -e
          TAG="${{ inputs.release_tag || github.ref_name }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Ref '$TAG' must match 'v<semver>' (e.g. v2.0.2)."
            exit 1
          fi
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build Release Bundle (upload-key signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
          GEMINI_API_KEY_2_5_FLASH_LITE: ${{ secrets.GEMINI_API_KEY_2_5_FLASH_LITE }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY_2_5_FLASH_LITE }}
          GEMINI_API_KEY_2_5_FLASH_LITE=${{ secrets.GEMINI_API_KEY_2_5_FLASH_LITE }}
          ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID=${{ secrets.ADMOB_REWARDED_ID }}
          ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY=${{ secrets.ONESIGNAL_API_KEY }}
          PACKAGE_NAME=${{ secrets.PACKAGE_NAME }}
          VERSION_CODE=$VERSION_CODE
          VERSION_NAME=$VERSION_NAME
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          EOF
          ./gradlew bundleRelease --stacktrace

      - name: Upload bundle to Play and roll out
        id: play_upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play_sa.json
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
          TRACK: ${{ inputs.track || 'production' }}
          STAGED_FRACTION: ${{ inputs.staged_fraction || '1.0' }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          timeout 600 python3 scripts/play_store.py upload "$PACKAGE_NAME" "$AAB" \
            --track "$TRACK" --staged-fraction "$STAGED_FRACTION" \
            --release-notes "$RELEASE_NOTES"

      - name: Fetch Play-signed universal APK
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play_sa.json
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        run: |
          timeout 900 python3 scripts/play_store.py fetch-universal-apk \
            "$PACKAGE_NAME" "$VERSION_CODE" --out app/release

      - name: Remove signing material and credentials
        if: always()
        run: rm -f app/keystore.jks app/google-services.json "$RUNNER_TEMP/play_sa.json"

      - name: Upload Play-signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-signed-universal-apk
          path: app/release/play-signed-universal.apk
          retention-days: 90
